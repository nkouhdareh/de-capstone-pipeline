<path class="edge" d="M672,140 C598,232 598,332 672,398" marker-end="url(#arw)"/>
<path class="spine" d="M762,281 L762,394" marker-end="url(#arws)"/>
<path class="spine" d="M852,420 L902,420" marker-end="url(#arws)"/>
<g><rect class="box" x="12" y="139" width="180" height="52" rx="9"/><text class="name" x="102" y="162">SILVER_DRUG_EVENT</text><text class="sub" x="102" y="178">source · 1.55M</text></g>
<g><rect class="box" x="12" y="274" width="180" height="52" rx="9"/><text class="name" x="102" y="297">DRUG_NDC</text><text class="sub" x="102" y="313">source · 136,520</text></g>
<g><rect class="box" x="230" y="139" width="180" height="52" rx="9"/><text class="name" x="320" y="162">stg_drug_event</text><text class="sub" x="320" y="178">view</text></g>
<g><rect class="box" x="230" y="274" width="180" height="52" rx="9"/><text class="name" x="320" y="297">stg_drug_ndc</text><text class="sub" x="320" y="313">view</text></g>
<g><rect class="box" x="448" y="207" width="180" height="52" rx="9"/><text class="name" x="538" y="230">int_drug_resolution</text><text class="sub" x="538" y="246">table · 13,243</text></g>
<g><rect class="box" x="672" y="109" width="180" height="52" rx="9"/><text class="name" x="762" y="132">dim_reaction</text><text class="sub" x="762" y="148">table · 8,213</text></g>
<g><rect class="box" x="672" y="229" width="180" height="52" rx="9"/><text class="name" x="762" y="252">dim_drug</text><text class="sub" x="762" y="268">table · 2,553</text></g>
<g><rect class="fctbox" x="672" y="394" width="180" height="52" rx="9"/><text class="name" x="762" y="417">fct_report_drug_reaction</text><text class="sub" x="762" y="433">table · 1.55M</text></g>
<g><rect class="accbox" x="902" y="394" width="180" height="52" rx="9"/><text class="accname" x="992" y="417">sem_signal_metrics</text><text class="accsub" x="992" y="433">view · PRR / ROR</text></g>
<text class="foot" x="20" y="522">Blue = signal output · resolution 86.9% of report-rows · 27 dbt tests passing (incl. hand-computed PRR/ROR)</text>
</svg>
