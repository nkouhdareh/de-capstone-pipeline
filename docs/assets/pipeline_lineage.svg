<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 540" width="1100" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="ttl">Drug-safety signal pipeline — dbt lineage</title>
<desc id="dsc">Two Snowflake RAW sources flow through staging views, a drug-resolution table, a star schema, into a PRR/ROR signals view.</desc>
<style>
:root{--ink:#1f2430;--muted:#6b7480;--panel:#ffffff;--border:#dbe0e8;--edge:#aab2be;--spine:#7b8698;--accent:#4f66e0;--accentink:#ffffff;--accentsoft:#eef1fd;--accentborder:#9fb0f4;--hdr:#8a93a3}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf3;--muted:#98a2b3;--panel:#1b2130;--border:#2f394a;--edge:#49546a;--spine:#6b7890;--accent:#6d83f3;--accentink:#0e1220;--accentsoft:#222c46;--accentborder:#4356b5;--hdr:#8791a3}}
.hdr{fill:var(--hdr);font-size:12px;font-weight:700;letter-spacing:.08em;text-anchor:middle}
.box{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
.fctbox{fill:var(--accentsoft);stroke:var(--accentborder);stroke-width:1.75}
.accbox{fill:var(--accent);stroke:var(--accentborder);stroke-width:1.5}
.name{fill:var(--ink);font-size:12px;font-weight:600;text-anchor:middle}
.sub{fill:var(--muted);font-size:10px;text-anchor:middle}
.accname{fill:var(--accentink);font-size:12px;font-weight:700;text-anchor:middle}
.accsub{fill:var(--accentink);font-size:10px;text-anchor:middle;opacity:.85}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6}
.spine{fill:none;stroke:var(--spine);stroke-width:2.2}
.title{fill:var(--ink);font-size:18px;font-weight:700}
.subtitle{fill:var(--muted);font-size:12px}
.foot{fill:var(--muted);font-size:11px}
</style>
<defs>
<marker id="arw" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="var(--edge)"/></marker>
<marker id="arws" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" fill="var(--spine)"/></marker>
</defs>
<text class="title" x="20" y="30">Drug-Safety Signal Pipeline — dbt lineage</text>
<text class="subtitle" x="20" y="50">openFDA FAERS · Snowflake + dbt · grain = one row per (case, drug, reaction)</text>
<text class="hdr" x="102" y="86">RAW · SNOWFLAKE</text>
<text class="hdr" x="320" y="86">STAGING</text>
<text class="hdr" x="538" y="86">INTERMEDIATE</text>
<text class="hdr" x="762" y="86">MARTS · STAR</text>
<text class="hdr" x="992" y="86">SEMANTIC</text>
<path class="spine" d="M192,165 L230,165" marker-end="url(#arws)"/>
<path class="edge" d="M192,300 L230,300" marker-end="url(#arw)"/>
<path class="spine" d="M410,175 L448,222" marker-end="url(#arws)"/>
<path class="edge" d="M410,292 L448,244" marker-end="url(#arw)"/>
<path class="spine" d="M628,240 L672,252" marker-end="url(#arws)"/>
<path class="edge" d="M410,155 C520,118 585,126 672,133" marker-end="url(#arw)"/>
