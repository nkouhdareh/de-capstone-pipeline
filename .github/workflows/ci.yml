name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Blocking: real errors only - syntax errors and undefined names.
      # scripts/PoC is week-1 proof-of-concept code, kept for provenance.
      - name: Errors that must block
        run: ruff check --select=E9,F63,F7,F82 --exclude scripts/PoC scripts app airflow/dags

      # Informational: the full rule set, never fails the build.
      - name: Full style report
        run: ruff check --exit-zero --statistics --exclude scripts/PoC scripts app airflow/dags

  syntax:
    name: python syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # ast.parse never imports the module, so the Airflow DAG is validated
      # without installing Airflow.
      - name: Parse every tracked Python file
        run: |
          failed=0
          for file in $(git ls-files '*.py'); do
            if python -c "import ast,sys; p=sys.argv[1]; ast.parse(open(p, encoding='utf-8').read(), p)" "$file"; then
              echo "ok    $file"
            else
              echo "FAIL  $file"
              failed=1
            fi
          done
          exit $failed

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reports file and line number only - the matching text is never printed.
      - name: Scan tracked files for real secret values
        run: |
          failed=0

          echo "1/3  private key blocks (all tracked files)"
          hits=$(git ls-files -z \
            | xargs -0 grep -nEI -- '-----BEGIN [A-Za-z ]*PRIVATE KEY-----' 2>/dev/null \
            | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then echo "FAIL - found at:"; echo "$hits"; failed=1; else echo "     clean"; fi

          echo "2/3  AWS access key ids (all tracked files)"
          hits=$(git ls-files -z \
            | xargs -0 grep -nEI -- 'AKIA[0-9A-Z]{16}' 2>/dev/null \
            | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then echo "FAIL - found at:"; echo "$hits"; failed=1; else echo "     clean"; fi

          # Code and config only: prose that merely names SNOWFLAKE_PASSWORD
          # is out of scope by construction. Placeholders are filtered out.
          echo "3/3  assigned secret values (code and config only)"
          hits=$(git ls-files -z -- '*.py' '*.sql' '*.yml' '*.yaml' '*.toml' '*.sh' '*.json' '*.cfg' '*.ini' 'Dockerfile*' \
            | xargs -0 grep -nEIi -- "(PASSWORD|SECRET|TOKEN|API_KEY)[A-Za-z_]*[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9/+=_-]{8,}" 2>/dev/null \
            | grep -vEi 'your_|placeholder|changeme|redacted|dummy|example|xxxx|env_var|secrets\.|\$\{|<' \
            | cut -d: -f1,2 || true)
          if [ -n "$hits" ]; then echo "FAIL - found at:"; echo "$hits"; failed=1; else echo "     clean"; fi

          exit $failed

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: de_capstone
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake (pinned to the project version)
        run: pip install "dbt-snowflake==1.12.0"

      # The real profiles.yml is gitignored, so CI writes its own. dbt parse
      # compiles models and never opens a connection, so these values are
      # never used - there are no credentials here.
      - name: Write a parse-only CI profile
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'PROFILE'
          de_capstone:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: parse-only
                user: parse_only
                password: "{{ env_var('DBT_CI_UNUSED', 'unused') }}"
                role: PARSE_ONLY
                database: PARSE_ONLY
                warehouse: PARSE_ONLY
                schema: PARSE_ONLY
                threads: 1
          PROFILE

      - name: dbt deps
        run: dbt deps

      # parse resolves every ref(), source(), macro and var without connecting.
      - name: dbt parse
        run: dbt parse