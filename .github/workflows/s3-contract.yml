name: S3 contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is what lets the runner request an OIDC token.
# Without it there is no token to exchange and no AWS access at all.
permissions:
  id-token: write
  contents: read

concurrency:
  group: s3-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:

  assume:
    name: assume the capstone role
    runs-on: ubuntu-latest

    steps:
      # Printed BEFORE the assume, so a failure still tells us why: the
      # subject GitHub actually issues is what the trust policy must match.
      # Only the sub and aud claims are printed - never the token itself.
      - name: Show the OIDC subject this repository issues
        run: |
          curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | python3 -c "
          import sys, json, base64
          payload = json.load(sys.stdin)['value'].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('sub:', claims['sub'])
          print('aud:', claims['aud'])
          "

      - name: Assume the capstone role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::617371012792:role/de-capstone-github-actions
          aws-region: eu-central-1

      # No stored AWS keys exist anywhere in this repository or its secrets.
      - name: Who am I?
        run: aws sts get-caller-identity